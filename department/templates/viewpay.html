{% extends "adminhome.html" %}
{% load static %}
{% block content %}

<div class="main-panel">
    <div class="content-wrapper">
        <div class="row">
            <div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Payment Details</h4>
                        <div class="table-responsive pt-3">
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>Si.no</th>
                                        <th>Name</th>
                                    
                                        <th>Date</th>
                                        <th>Amount</th>
                                        <th>Card type</th>
                                        <th>Card No</th>
                                        <th>Cvv</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for d in data %}
                                    <tr>
                                        <td>{{forloop.counter}}</td>
                                        <td>{{d.user.name}}</td>
                                        
                                        <td>{{d.date}}</td>
                                        <td>{{d.amount}}</td>
                                        <td>{{d.cardtype}}</td>
                                        <td>{{d.cardno}}</td>
                                        <td>{{d.cvv}}</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
