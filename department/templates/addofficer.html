{% extends "departmenthome.html" %}
{% load static %}
{% block content %}
<style>
    #head {
        margin-left: 410px;
        margin-top: 30px;
    }

    h2 {
        margin-left: -85px;
        margin-top: 30px;
    }

    .logo {
        font-size: 18px;
        margin-left: 4px;
    }

    #in {
        height: 43px;
        width: 400px;
        margin-left: -66px;
    }

    .but {
        width: 90px;
        height: 30px;
    }

    .log {
        font-size: 18px;
        margin-left: 2px;
        margin-top: 15px;
    }

    #college {
        height: 50px;
    }

    #text {
        height: 120px;
        margin-left: -67px;
        width: 400px;
    }

    .tit {
        margin-top: 15px;
    }
    #int{
        height: 43px;
        width: 400px;
        margin-left: -80px;
    }
    #bot{
        margin-left: 325px;
    }
</style>

<div class="main-panel">
    <div class="content-wrapper">
        <div class="row">
            <div class="col-md-12 grid-margin">
                <div class="row">
                    <div class="col-12 col-xl-8 mb-4 mb-xl-0">
                        <table>
                            <div class="col-lg-5" id="head">
                                <div class="section-title">
                                    <h2>Add New Police Officer</h2>
                                    <p></p>
                                </div>

                                <form action="{% url 'police' %}" onsubmit="" method="post"
                                    role="form">
                                    {% csrf_token %}
                                    <div class="form-row">
                                        <div class="col-lg-12 col-md-12 form-group">
                                            <input type="text" name="name" class="form-control tit" id="in"
                                                placeholder="Enter Name">
                                            <div class="validate"></div>
                                        </div>
                                        <div class="col-lg-12 col-md-12 form-group">
                                            <input type="number" name="idno" class="form-control" id="in"
                                                placeholder="Enter Id Number">
                                            <div class="validate"></div>
                                        </div>
                                        <div class="col-lg-12 col-md-12 form-group">
                                            <input type="text" name="designation" class="form-control" id="in" placeholder="Designation">
                                            <div class="validate"></div>
                                        </div>
                                        <div class="col-lg-12 col-md-12 form-group">
                                            <textarea type="text" class="form-control" name="address" id="text"
                                                placeholder="Address"></textarea>
                                            <div class="validate"></div>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 col-md-12 form-group">
                                        <input type="number" name="contactno" class="form-control" id="int" placeholder="Contact Number">
                                        <div class="validate"></div>
                                    </div>

                                    </div>


                                    <div class="text-center" id="bot"><input type="submit" value="Save" class="but"
                                            style="background:#8cbde7;" /></div>
                                </form>
                            </div>
                            <div class="col-lg-2">
                            </div>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
